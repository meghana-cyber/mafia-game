<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11131b">
<title>Mafia</title>
<style>
:root{color-scheme:dark;--bg:#11131b;--panel:#1a1d28;--panel2:#202431;--ink:#f2eee7;--mut:#9b9ba8;--line:#ffffff16;--acc:#df5e4d;--acc2:#f08b62;--ok:#79c9a0;--glow:#df5e4d33;--shadow:0 22px 60px #0005}
body[data-t=day]{color-scheme:light;--bg:#eae3d8;--panel:#f8f3eb;--panel2:#eee6db;--ink:#28241f;--mut:#776f67;--line:#32271b20;--acc:#aa4035;--acc2:#d36d47;--ok:#337e5a;--glow:#aa403522;--shadow:0 22px 60px #62472d18}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{min-height:100vh;margin:0;background:radial-gradient(ellipse at 12% 0%,var(--glow),transparent 36%),radial-gradient(ellipse at 95% 70%,#e0a2670d,transparent 35%),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background-color .7s,color .7s; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{width:min(1160px,100%);margin:0 auto;padding:clamp(18px,4vw,48px)}
h1,h2,h3,p{margin-top:0}
h1,h2,.role{font-family:Georgia,"Times New Roman",serif}
h1{font-size:clamp(3.5rem,10vw,6.6rem);line-height:.95;letter-spacing:-.065em;margin:.12em 0 .18em}
h2{font-size:1.65rem;line-height:1.15;margin:0}
h3{font-size:.76rem;letter-spacing:.13em;text-transform:uppercase;margin:0}
.mut{color:var(--mut)}
.eyebrow,.phase-label{color:var(--acc2);font-size:.72rem;font-weight:750;letter-spacing:.19em;text-transform:uppercase}
.card{background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--panel) 85%,transparent));border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0;box-shadow:var(--shadow);backdrop-filter:blur(12px);transition:background .6s,border-color .3s,transform .25s}
input{min-width:0;width:100%;padding:13px 15px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;margin:6px 0;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:var(--mut)}
input:focus{border-color:var(--acc2);box-shadow:0 0 0 3px var(--glow);outline:0}
button{padding:10px 15px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;font-size:.9rem;font-weight:600;line-height:1.2;cursor:pointer;margin:3px 3px 3px 0;transition:transform .18s,background .2s,border-color .2s,color .2s,box-shadow .2s}
button:hover:not(:disabled){transform:translateY(-2px);border-color:var(--acc2);box-shadow:0 7px 20px #0002}
button:active:not(:disabled){transform:translateY(0) scale(.98)}
button.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;box-shadow:0 8px 22px var(--glow)}
button.sel{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--panel2));color:var(--ok)}
button:disabled{opacity:.42;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc2);outline-offset:3px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.dead .nm{text-decoration:line-through;color:var(--mut)}
.role{font-size:2rem;color:var(--acc2);text-transform:capitalize}
.bad{color:var(--acc)}.good{color:var(--ok)}
#home{max-width:690px;margin:clamp(24px,8vh,100px) auto;animation:rise-in .65s both}
#home>p{max-width:460px;font-size:1.08rem}
.home-form{display:flex;gap:10px;align-items:center;max-width:540px;margin-top:30px}
.home-form input{margin:0}
.home-form .pri{white-space:nowrap}
.join-form{display:flex;gap:8px;align-items:center}
.join-form input{margin:0;text-transform:uppercase;letter-spacing:.16em}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 22px;padding:15px 19px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow)}
.bar-title{display:flex;align-items:center;gap:14px}
.phase-dot{width:11px;height:11px;border-radius:50%;background:var(--acc2);box-shadow:0 0 18px var(--acc2);animation:glow-pulse 2.2s ease-in-out infinite}
body[data-phase=day] .phase-dot{background:var(--ok);box-shadow:0 0 18px var(--ok)}
.room-chip{display:inline-flex;align-items:center;gap:8px;margin-left:auto;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:.83rem;white-space:nowrap}
.game-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;align-items:start;gap:18px}
.sidebar{position:sticky;top:18px}
.sidebar .card{margin-top:0}
.panel-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-card{padding:22px}
.lobby-intro{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px}
.player-count{white-space:nowrap;padding:7px 11px;border:1px solid var(--line);border-radius:999px;color:var(--mut);font-size:.82rem}
.player-list{max-height:440px;overflow:auto;padding-right:4px}
.phase-transition .player-list .row{animation:row-in .3s both}
.phase-transition .player-list .row:nth-child(2){animation-delay:.025s}.phase-transition .player-list .row:nth-child(3){animation-delay:.05s}.phase-transition .player-list .row:nth-child(4){animation-delay:.075s}
.player-list .nm{overflow-wrap:anywhere}
.player-actions{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:4px}
.role-card{position:relative;overflow:hidden}
.role-card:after{content:"";position:absolute;width:170px;height:170px;right:-58px;top:-80px;border-radius:50%;background:var(--glow);filter:blur(4px);pointer-events:none}
.role-card>*{position:relative;z-index:1}
.role-card .mut{max-width:560px}
.status-note{padding:12px 15px;border-left:3px solid var(--acc2);border-radius:0 10px 10px 0;background:var(--glow);color:var(--mut)}
.phase-transition{animation:phase-in .45s both}
#msgs,#log{max-height:240px;overflow:auto;font-size:.9rem;scrollbar-color:var(--mut) transparent;scrollbar-width:thin}
#msgs p,#log p{margin:0;padding:8px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
#msgs p:last-child,#log p:last-child{border:0}
#msgs .m{color:var(--acc2)}
#cf{position:sticky;bottom:-20px;display:flex;gap:8px;padding:10px 0 0;background:var(--panel)}
#cf input{margin:0}
.invite-link{overflow-wrap:anywhere;color:var(--acc2)}
.role-tag{font-size:.75rem;text-transform:capitalize}
#tm{display:inline-block;min-width:3ch;color:var(--acc2);font:600 1rem/1 ui-monospace,monospace;font-variant-numeric:tabular-nums}
@keyframes rise-in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes phase-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes row-in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes glow-pulse{50%{opacity:.45;transform:scale(.82)}}
@media(max-width:800px){.game-layout{grid-template-columns:1fr}.sidebar{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.sidebar .card{margin:0}}
@media(max-width:540px){main{padding:18px 14px}.topbar{align-items:center;flex-wrap:wrap;padding:13px;gap:8px}.bar-title{align-items:flex-start;gap:9px;flex:1 1 60%}.topbar h2{font-size:1.35rem}.room-chip{margin-left:0;font-size:.75rem}.sidebar{grid-template-columns:1fr}.home-form{align-items:stretch;flex-direction:column}.home-form button{width:100%;padding:13px}.join-form{align-items:stretch}.section-card{padding:17px}.lobby-intro{align-items:flex-start;flex-direction:column}.player-actions button{padding:8px 10px}.player-list{max-height:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head>
<body data-t="night"><main>
<section id="home">
  <div class="eyebrow">A game of trust and betrayal</div>
  <h1>Mafia</h1>
  <p class="mut">Read the room. Find the truth. Make it to morning.</p>
  <div class="home-form"><input id="name" placeholder="Your name" maxlength="14" autocomplete="nickname">
  <button class="pri" id="create">Create a room</button></div>
  <div class="card"><h3>Joining friends?</h3><p class="mut">Enter the four-letter room code to join their game.</p>
    <div class="join-form"><input id="code" placeholder="Room code" maxlength="4" autocapitalize="characters" aria-label="Room code">
    <button id="join">Join room</button></div></div>
</section>
<section id="game" hidden>
  <header id="bar" class="topbar"></header>
  <div class="game-layout">
  <div id="main" aria-live="polite"></div>
  <aside class="sidebar">
  <section class="card"><div class="panel-heading"><h3>Game events</h3></div><div id="log"></div></section>
  <section class="card"><div class="panel-heading"><h3>Town chat</h3></div><div id="msgs"></div>
    <form id="cf"><input id="ci" maxlength="200" placeholder="Say something" autocomplete="off"><button>Send</button></form>
  </section>
  </aside>
  </div>
</section>
</main>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=s=>document.querySelector(s), S=io();
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pid=localStorage.pid||(localStorage.pid=Math.random().toString(36).slice(2)+Date.now().toString(36));
const DESC={mafia:'Each night, choose someone to kill. Stay hidden by day.',doctor:'Each night, choose one player to protect from the Mafia.',
 detective:'Each night, investigate one player to learn if they are Mafia.',villager:'Find the Mafia and vote them out.'};
const VERB={mafia:'Kill',doctor:'Save',detective:'Investigate'};
let st=null,endAt=0,lastScene='';
$('#name').value=localStorage.name||'';
$('#code').value=(new URLSearchParams(location.search).get('room')||'').toUpperCase();
const nm=()=>{const n=$('#name').value.trim();if(!n){alert('Enter your name first.');return}localStorage.name=n;return n};
$('#create').onclick=()=>{const n=nm();n&&S.emit('create',{name:n,pid})};
$('#join').onclick=()=>{const n=nm();n&&S.emit('join',{room:$('#code').value.trim(),name:n,pid})};
$('#cf').onsubmit=e=>{e.preventDefault();S.emit('chat',$('#ci').value);$('#ci').value=''};
S.on('connect',()=>{if(localStorage.room&&localStorage.name)S.emit('join',{room:localStorage.room,name:localStorage.name,pid,silent:1})});
S.on('gone',()=>{localStorage.removeItem('room');$('#home').hidden=false;$('#game').hidden=true});
S.on('err',m=>alert(m));
S.on('state',s=>{st=s;endAt=Date.now()+s.left;localStorage.room=s.code;history.replaceState(0,'','?room='+s.code);draw()});
setInterval(()=>{const e=$('#tm');if(e&&st)e.textContent=['night','day'].includes(st.phase)?Math.max(0,Math.ceil((endAt-Date.now())/1000))+'s':''},500);
const leave=()=>{localStorage.removeItem('room');location='/'};

function draw(){
  $('#home').hidden=true;$('#game').hidden=false;
  const me=st.you,ph=st.phase,P=st.players;
  const scene=ph+':'+st.day;
  document.body.dataset.phase=ph;
  document.body.dataset.t=(ph==='day'||(ph==='over'&&st.winner==='Town'))?'day':'night';
  const title={lobby:'Lobby',night:'Night '+st.day,day:'Day '+st.day,over:'Game over'}[ph];
  $('#bar').innerHTML=`<div class="bar-title"><span class="phase-dot" aria-hidden="true"></span><div><div class="phase-label">${ph==='lobby'?'Gather your players':ph==='over'?'The final verdict':'The town is watching'}</div><h2>${title} <span id="tm"></span></h2></div></div><span class="room-chip"><span class="mut">ROOM</span> <b>${st.code}</b></span><button onclick="leave()">Leave</button>`;
  let h='';
  if(ph==='lobby'){
    h+=`<div class="card section-card"><div class="lobby-intro"><div><div class="phase-label">Before the first night</div><h2>Make your suspects</h2></div><span class="player-count">${P.length} / 20 players</span></div>
    <p class="mut">Invite friends with this link:<br><b class="invite-link">${esc(location.origin)}/?room=${st.code}</b></p>
    <div class="player-list">${P.map(p=>`<div class="row"><span class="nm">${p.isBot?'Bot · ':''}${esc(p.name)}${p.isHost?' <span class="mut">· host</span>':''}</span><span class="mut">${p.isBot?'BOT':'PLAYER'}</span></div>`).join('')}</div></div>`;
    h+=me.isHost?`<div class="player-actions"><button onclick="S.emit('addbot')">Add bot</button><button onclick="S.emit('addbot',1)">Fill with bots</button>
      <button class="pri" onclick="S.emit('start')" ${P.length<4?'disabled':''}>${P.length<4?'Need '+(4-P.length)+' more':'Start the game'}</button></div>`
      :'<p class="status-note">Waiting for the host to begin. You can invite others using the room link.</p>';
  }else{
    if(me.role){
      const mates=me.role==='mafia'?P.filter(p=>p.role==='mafia'&&p.id!==me.id).map(p=>esc(p.name)):[];
      h+=`<div class="card role-card"><div class="phase-label">${me.alive?'Your hidden identity':'You have been eliminated'}</div><div class="role">${me.role}</div>
      <div class="mut">${DESC[me.role]}${mates.length?`<br>Your partners: <b>${mates.join(', ')}</b>`:''}</div>
      ${st.known.length?'<div style="margin-top:8px">'+st.known.map(k=>`<div>${esc(k.name)}: <b class="${k.mafia?'bad':'good'}">${k.mafia?'Mafia':'Not Mafia'}</b></div>`).join('')+'</div>':''}</div>`;
    }
    if(ph==='over')h+=`<div class="card"><div class="phase-label">The verdict</div><div class="role">${st.winner==='Town'?'The town wins':'The Mafia wins'}</div>
      ${me.isHost?'<button class="pri" onclick="S.emit(\'again\')">Play again</button>':'<span class="mut">Waiting for the host to restart.</span>'}</div>`;
    else if(ph==='night'&&me.alive&&!VERB[me.role])h+='<p class="status-note">Night has fallen. Keep your suspicions close until morning.</p>';
    else if(ph==='day'&&me.alive)h+='<p class="status-note">Discuss the clues, then vote someone out. A tie means nobody goes.</p>';
    h+='<div class="card section-card"><div class="panel-heading"><h3>Players</h3><span class="mut">'+P.filter(p=>p.alive).length+' alive · '+P.length+' total</span></div><div class="player-list">'+P.map(p=>{
      let b='';
      if(ph==='night'&&me.alive&&VERB[me.role]&&p.alive&&!(me.role==='mafia'&&p.role==='mafia')&&!(me.role==='detective'&&p.id===me.id))
        b=`<button class="${st.myAct===p.id?'sel':''}" onclick="S.emit('act','${p.id}')">${VERB[me.role]}</button>`;
      if(ph==='day'&&me.alive&&p.alive&&p.id!==me.id)
        b=`<button class="${st.myVote===p.id?'sel':''}" onclick="S.emit('vote','${p.id}')">Vote${st.tally[p.id]?' · '+st.tally[p.id]:''}</button>`;
      const tag=p.role&&(ph==='over'||!p.alive||p.role===me.role)?` <span class="mut role-tag">${p.role}</span>`:'';
      return `<div class="row ${p.alive?'':'dead'}"><span class="nm">${p.isBot?'Bot · ':''}${esc(p.name)}${p.id===me.id?' <span class="mut">(you)</span>':''}</span><span class="player-actions">${tag}${b}</span></div>`}).join('')+'</div>'+
      (ph==='day'&&me.alive?`<button class="${st.myVote==='skip'?'sel':''}" onclick="S.emit('vote','skip')">Skip vote${st.tally.skip?' · '+st.tally.skip:''}</button>`:'')+'</div>';
  }
  $('#main').className=scene!==lastScene?'phase-transition':'';
  lastScene=scene;
  $('#main').innerHTML=h;
  $('#log').innerHTML=st.log.map(l=>`<p>${esc(l)}</p>`).join('');$('#log').scrollTop=1e9;
  $('#msgs').innerHTML=st.chat.map(m=>`<p class="${m.c==='mafia'?'m':''}"><b>${esc(m.n)}${m.c==='mafia'?' (mafia)':''}:</b> ${esc(m.t)}</p>`).join('');$('#msgs').scrollTop=1e9;
  const can=ph==='lobby'||ph==='over'||(ph==='day'&&me.alive)||(ph==='night'&&me.alive&&me.role==='mafia');
  $('#ci').disabled=!can;$('#ci').placeholder=can?(ph==='night'?'Mafia-only chat':'Say something'):'Chat is closed right now';
}
</script></body></html>
